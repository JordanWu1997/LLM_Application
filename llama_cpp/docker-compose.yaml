version: '3.8'

services:

  llamacpp-server-8081:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llamacpp-server-8081
    restart: always
    # The exact equivalent of `-it` (Interactive + TTY)
    stdin_open: true # -i
    tty: true        # -t
    # Mandatory: Share host memory space to prevent PyTorch/vLLM crashes
    ipc: host
    ports:
      - "8081:8081"
    volumes:
      - .:/workplace
    working_dir: /workplace
    # Mandatory ulimit setting for memory locking
    ulimits:
      memlock:
        soft: -1
        hard: -1
    # GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Clear out the vLLM Python entrypoint
    entrypoint: [""]
    # Set the idling command to keep container up
    command: tail -f /dev/null
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

